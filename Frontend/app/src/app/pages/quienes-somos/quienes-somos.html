<div class="container">

  @for (seccion of secciones; track seccion.titulo) {

    <section>
      <h2>{{ seccion.titulo }}</h2>

      @if (seccion.parrafos.length > 0) {
        @for (parrafo of seccion.parrafos; track parrafo) {
          <p>{{ parrafo }}</p>
        }
      }

      @if (seccion.items.length > 0) {
        <ul>
          @for (item of seccion.items; track item) {
            <li>{{ item }}</li>
          }
        </ul>
      }

    </section>

  }

</div>
