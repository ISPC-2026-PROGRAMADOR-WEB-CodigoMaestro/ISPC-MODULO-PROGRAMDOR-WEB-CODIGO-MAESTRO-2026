<div class="main-content">
  <form
    [formGroup]="formularioRegistro"
    (ngSubmit)="onSubmit()"
    novalidate
    class="form-registro"
  >

    <h2>Registro de Usuario</h2>

    <label for="nombre">Nombre</label>
    <input
      type="text"
      id="nombre"
      formControlName="nombre"
      placeholder="Ej. Franco"
    >

    <small *ngIf="formularioRegistro.get('nombre')?.invalid && formularioRegistro.get('nombre')?.touched">
      El nombre es obligatorio.
    </small>

    <label for="apellido">Apellido</label>
    <input
      type="text"
      id="apellido"
      formControlName="apellido"
      placeholder="Ej. Santos"
    >

    <small *ngIf="formularioRegistro.get('apellido')?.invalid && formularioRegistro.get('apellido')?.touched">
      El apellido es obligatorio.
    </small>

    <label for="email">Correo electrónico</label>
    <input
      type="email"
      id="email"
      formControlName="email"
      placeholder="Ej. franco.santos@gmail.com"
    >

    <small *ngIf="formularioRegistro.get('email')?.invalid && formularioRegistro.get('email')?.touched">
      Ingrese un correo electrónico válido.
    </small>

    <label for="password">Contraseña</label>
    <input
      type="password"
      id="password"
      formControlName="password"
      placeholder="Mínimo 8 caracteres"
    >

    <small *ngIf="formularioRegistro.get('password')?.invalid && formularioRegistro.get('password')?.touched">
      La contraseña debe tener mínimo 8 caracteres.
    </small>

    <label for="confirmPassword">Confirmar contraseña</label>
    <input
      type="password"
      id="confirmPassword"
      formControlName="confirmPassword"
      placeholder="Repita la contraseña"
    >

    <small *ngIf="formularioRegistro.get('confirmPassword')?.invalid && formularioRegistro.get('confirmPassword')?.touched">
      Debe confirmar la contraseña.
    </small>

    <label for="telefono">Teléfono</label>
    <input
      type="number"
      id="telefono"
      formControlName="telefono"
      placeholder="351536989"
    >

    <label for="fechaNacimiento">Fecha de nacimiento</label>
    <input
      type="date"
      id="fechaNacimiento"
      formControlName="fechaNacimiento"
    >

    <label for="direccion">Dirección</label>
    <input
      type="text"
      id="direccion"
      formControlName="direccion"
      placeholder="Ej. Calle Reforma 123"
    >

    <label for="provincia">Provincia</label>
    <select id="provincia" formControlName="provincia">
      <option value="">Seleccione una provincia</option>

        <option *ngFor="let provincia of provincias" [value]="provincia">
        {{ provincia }}
      </option>
    </select>

    <small *ngIf="formularioRegistro.get('provincia')?.invalid && formularioRegistro.get('provincia')?.touched">
      Seleccione una provincia.
    </small>

    <p *ngIf="mensajeExito" class="success-message">
      Registro completado con éxito!!
    </p>

    <button type="submit">
      Registrarse
    </button>

  </form>
</div>
