<section class="container mt-5 text-center">
  <h1 class="mb-4">{{ titulo }}</h1>

  <p class="lead mb-4">
    {{ descripcion }}
  </p>

  <button class="btn btn-primary btn-lg">
    {{ textoBoton }}
  </button>
</section>

<section class="container mt-5">
  <div class="conteinerSection">
    <div class="row text-center">

      @for (beneficio of beneficios; track beneficio.titulo) {
        <div class="col-md-4">
          <div [class]="beneficio.clase">
            <h3>{{ beneficio.icono }} {{ beneficio.titulo }}</h3>
            <p>{{ beneficio.descripcion }}</p>
          </div>
        </div>
      }

    </div>
  </div>
</section>

@if (imagenesCarrusel.length > 0) {
  <div class="conteiner-carrusel">
    <div id="carouselExampleRide" class="carousel slide" data-bs-ride="true">

      <div class="carousel-inner">

        @for (imagen of imagenesCarrusel; track imagen.src; let i = $index) {
          <div class="carousel-item" [class.active]="i === 0">
            <img
              [src]="imagen.src"
              class="d-block w-100"
              [alt]="imagen.alt"
            >
          </div>
        }

      </div>

      <button
        class="carousel-control-prev"
        type="button"
        data-bs-target="#carouselExampleRide"
        data-bs-slide="prev"
      >
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Anterior</span>
      </button>

      <button
        class="carousel-control-next"
        type="button"
        data-bs-target="#carouselExampleRide"
        data-bs-slide="next"
      >
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Siguiente</span>
      </button>

    </div>
  </div>
}
